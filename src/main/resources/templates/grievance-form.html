<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Grievance - CGRS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a th:href="@{/dashboard}">CGRS</a>
            </div>
            <div class="nav-menu">
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>Submit New Grievance</h1>
                <a th:href="@{/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
            
            <div class="form-container">
                <form th:action="@{/grievance/submit}" th:object="${grievance}" method="post" 
                      enctype="multipart/form-data" class="grievance-form">
                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <input type="text" id="subject" th:field="*{subject}" required>
                        <span th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}" class="error-text"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" th:field="*{category}" required>
                            <option value="">Select a category</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat.name()}" 
                                    th:text="${cat.displayName}">Category</option>
                        </select>
                        <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="error-text"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="location">Location *</label>
                        <input type="text" id="location" th:field="*{location}" 
                               placeholder="e.g., Building A, Room 101" required>
                        <span th:if="${#fields.hasErrors('location')}" th:errors="*{location}" class="error-text"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description *</label>
                        <textarea id="description" th:field="*{description}" rows="6" required
                                  placeholder="Please provide detailed information about the issue..."></textarea>
                        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error-text"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="image">Image Proof (Optional)</label>
                        <input type="file" id="image" name="image" accept="image/*">
                        <small class="form-text">Upload an image as proof of the issue (Max 10MB). Supported formats: JPG, PNG, GIF</small>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Submit Grievance</button>
                        <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
